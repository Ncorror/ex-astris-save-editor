name: build apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prepare artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p release-files verification-files

          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-files/ex-astris-save-editor.apk
          fi

          echo "Application: Ex Astris Save Editor" > release-files/build-info.txt
          echo "Version: 1.4.1" >> release-files/build-info.txt
          echo "Build number: $GITHUB_RUN_NUMBER" >> release-files/build-info.txt
          echo "Commit: $GITHUB_SHA" >> release-files/build-info.txt
          echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release-files/build-info.txt
          echo "Android compile SDK: 34" >> release-files/build-info.txt
          echo "Root support: libsu 6.0.0" >> release-files/build-info.txt
          echo "Shizuku support: 13.1.5" >> release-files/build-info.txt
          echo "Theme: Dark Material 3" >> release-files/build-info.txt

          cp release-files/build-info.txt verification-files/build-info.txt
          cp build.log release-files/build.log 2>/dev/null || true
          cp build.log verification-files/build.log 2>/dev/null || true
          cp -a app/build/reports verification-files/reports 2>/dev/null || true
          cp -a app/build/test-results verification-files/test-results 2>/dev/null || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-astris-save-editor-debug
          path: release-files/
          if-no-files-found: warn

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-astris-save-editor-verification
          path: verification-files/
          if-no-files-found: warn

      - name: Publish release on tag
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/ex-astris-save-editor.apk
            release-files/build.log
            release-files/build-info.txt
          generate_release_notes: true

      - name: Mark build as failed
        if: steps.build.outcome != 'success'
        run: exit 1
