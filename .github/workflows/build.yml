name: build apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prepare APK package
        run: |
          mkdir -p release-files

          cp app/build/outputs/apk/debug/*.apk release-files/ex-astris-save-editor.apk || true

          cat > release-files/build-info.txt <<INFO
Application: Ex Astris Save Editor
Version: 1.0.0
Build number: ${{ github.run_number }}
Commit: ${{ github.sha }}
Build date: $(date -u)
Android compile SDK: 34
Shizuku support: enabled
Theme: Dark Material 3
INFO

          cp build.log release-files/build.log || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ex-astris-save-editor-debug
          path: release-files/
          if-no-files-found: warn

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ex-astris-save-editor-verification
          path: |
            build.log
            app/build/reports/
          if-no-files-found: warn
