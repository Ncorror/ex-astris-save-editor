plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.exa.save'
    compileSdk 34

    defaultConfig {
        applicationId "com.exa.save"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // zstd с готовыми нативными библиотеками под Android.
    // Если версия не найдётся при сборке, попробуй соседние: 1.5.5-11, 1.5.4-2.
    implementation 'com.github.luben:zstd-jni:1.5.6-3@aar'
}
